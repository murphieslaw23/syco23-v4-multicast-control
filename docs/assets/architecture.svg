<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" fill="none">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050506"/>
      <stop offset="100%" style="stop-color:#0b0a0d"/>
    </linearGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#18161b"/>
      <stop offset="100%" style="stop-color:#121115"/>
    </linearGradient>
    <filter id="glow-orange">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="400" fill="url(#arch-bg)"/>

  <!-- Title -->
  <text x="300" y="32" font-family="'JetBrains Mono', monospace" font-size="14" fill="#6b7280" letter-spacing="0.15em">SYSTEM ARCHITECTURE</text>

  <!-- User node -->
  <rect x="40" y="160" width="100" height="50" rx="4" fill="#121115" stroke="#312e38" stroke-width="1"/>
  <text x="60" y="190" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ded9e2">OPERATOR</text>

  <!-- Arrow to app -->
  <line x1="140" y1="185" x2="190" y2="185" stroke="#312e38" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- App shell -->
  <rect x="190" y="120" width="160" height="130" rx="4" fill="url(#node)" stroke="#b7410e" stroke-width="1.5"/>
  <text x="232" y="145" font-family="'JetBrains Mono', monospace" font-size="10" fill="#b7410e" font-weight="700">APP SHELL</text>
  <text x="210" y="168" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">app.vue</text>
  <text x="210" y="184" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">Header + Nav</text>
  <text x="210" y="200" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">Status Badge</text>
  <text x="210" y="216" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">Layout Engine</text>
  <text x="210" y="232" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">Video Preview</text>

  <!-- Arrow to composables -->
  <line x1="350" y1="185" x2="400" y2="185" stroke="#312e38" stroke-width="1.5"/>

  <!-- Composables layer -->
  <rect x="400" y="80" width="180" height="210" rx="4" fill="url(#node)" stroke="#4a7c7a" stroke-width="1.5"/>
  <text x="432" y="105" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4a7c7a" font-weight="700">COMPOSABLES</text>
  <text x="420" y="128" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">usePipeline</text>
  <text x="420" y="144" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">useDestinationMatrix</text>
  <text x="420" y="160" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">useSycoStream</text>
  <text x="420" y="176" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">useSourceIngest</text>
  <text x="420" y="192" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">useWatchdog</text>
  <text x="420" y="208" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">useSycoMetadata</text>
  <text x="420" y="224" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">useLogs · useTemplates</text>
  <text x="420" y="240" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">useTransmissionKit</text>
  <text x="420" y="256" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">useSycoLayout</text>
  <text x="420" y="272" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">useLocalProvider</text>

  <!-- Arrow to store -->
  <line x1="580" y1="185" x2="630" y2="185" stroke="#312e38" stroke-width="1.5"/>

  <!-- Store -->
  <rect x="630" y="140" width="130" height="90" rx="4" fill="url(#node)" stroke="#9a7b2e" stroke-width="1.5"/>
  <text x="656" y="165" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9a7b2e" font-weight="700">STORE</text>
  <text x="650" y="188" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">reactive</text>
  <text x="650" y="204" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">SycoAppState</text>
  <text x="650" y="220" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">10 destinations</text>

  <!-- Arrow to types -->
  <line x1="695" y1="230" x2="695" y2="280" stroke="#312e38" stroke-width="1.5"/>

  <!-- Types -->
  <rect x="630" y="280" width="130" height="50" rx="4" fill="url(#node)" stroke="#6b7280" stroke-width="1"/>
  <text x="652" y="308" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6b7280" font-weight="700">TYPES</text>
  <text x="650" y="322" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8a8194">10 providers</text>

  <!-- Arrow to server -->
  <line x1="760" y1="185" x2="810" y2="185" stroke="#312e38" stroke-width="1.5"/>

  <!-- Server -->
  <rect x="810" y="140" width="80" height="90" rx="4" fill="url(#node)" stroke="#6b7280" stroke-width="1"/>
  <text x="820" y="168" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6b7280" font-weight="700">SERVER</text>
  <text x="820" y="184" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8a8194">schema</text>
  <text x="820" y="198" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8a8194">metadata</text>
  <text x="820" y="212" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8a8194">watchdog</text>

  <!-- Data flow labels -->
  <text x="155" y="175" font-family="'JetBrains Mono', monospace" font-size="7" fill="#6b7280">interacts</text>
  <text x="365" y="175" font-family="'JetBrains Mono', monospace" font-size="7" fill="#6b7280">delegates</text>
  <text x="595" y="175" font-family="'JetBrains Mono', monospace" font-size="7" fill="#6b7280">reads/writes</text>
  <text x="775" y="175" font-family="'JetBrains Mono', monospace" font-size="7" fill="#6b7280">contracts</text>

  <!-- Legend -->
  <rect x="40" y="360" width="820" height="1" fill="#232128"/>
  <text x="40" y="385" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6b7280">100% test coverage · 160 tests · Vue 3 + Vite + TypeScript · Dark theme · Responsive</text>
</svg>
