<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050506"/>
      <stop offset="100%" style="stop-color:#0b0a0d"/>
    </linearGradient>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b7410e"/>
      <stop offset="100%" style="stop-color:#8b1a1a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#18161b"/>
      <stop offset="100%" style="stop-color:#121115"/>
    </linearGradient>
    <linearGradient id="live" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b7410e"/>
      <stop offset="100%" style="stop-color:#9a7b2e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#121115"/>
  <rect x="0" y="54" width="1200" height="1" fill="#232128"/>

  <!-- Brand -->
  <text x="24" y="35" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#ded9e2" letter-spacing="0.05em">SYCO23</text>
  <text x="100" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6b7280" letter-spacing="0.12em">BROADCAST CONTROL</text>

  <!-- LIVE badge -->
  <rect x="1060" y="16" width="64" height="24" rx="2" fill="none" stroke="#b7410e" stroke-width="1.5"/>
  <text x="1076" y="33" font-family="'JetBrains Mono', monospace" font-size="12" fill="#b7410e" font-weight="700">LIVE</text>

  <!-- Main content area -->
  <rect x="24" y="80" width="760" height="480" rx="4" fill="url(#panel)" stroke="#232128" stroke-width="1"/>

  <!-- SESSION panel -->
  <rect x="40" y="96" width="728" height="120" rx="3" fill="#121115" stroke="#232128" stroke-width="1"/>
  <text x="56" y="118" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6b7280" letter-spacing="0.12em">SESSION</text>
  <rect x="56" y="132" width="80" height="28" rx="2" fill="none" stroke="#b7410e" stroke-width="1.5"/>
  <text x="72" y="151" font-family="'JetBrains Mono', monospace" font-size="13" fill="#b7410e" font-weight="700">LIVE</text>
  <text x="160" y="151" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a8194">UPTIME 00:12:34</text>

  <!-- Source info -->
  <text x="56" y="185" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6b7280" letter-spacing="0.1em">SOURCE</text>
  <text x="56" y="200" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a8194">rtmp://ingest.syco23.de/live</text>

  <!-- NOW PLAYING panel -->
  <rect x="40" y="232" width="728" height="80" rx="3" fill="#121115" stroke="#232128" stroke-width="1"/>
  <text x="56" y="254" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6b7280" letter-spacing="0.12em">NOW PLAYING</text>
  <text x="56" y="280" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ded9e2">Midnight Echo</text>
  <text x="56" y="298" font-family="'Inter', sans-serif" font-size="12" fill="#8a8194">SYCO23 Live Set — 128 listeners</text>

  <!-- PIPELINE panel -->
  <rect x="40" y="328" width="728" height="60" rx="3" fill="#121115" stroke="#232128" stroke-width="1"/>
  <text x="56" y="350" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6b7280" letter-spacing="0.12em">PIPELINE</text>
  <rect x="56" y="360" width="44" height="20" rx="2" fill="none" stroke="#6b8e6b" stroke-width="1"/>
  <text x="64" y="374" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6b8e6b" font-weight="700">OK</text>
  <text x="120" y="374" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8a8194">30fps · h264 · 4500kbps</text>

  <!-- Video preview area -->
  <rect x="40" y="404" width="728" height="140" rx="3" fill="#050506" stroke="#232128" stroke-width="1"/>
  <rect x="320" y="430" width="168" height="80" rx="4" fill="none" stroke="#b7410e" stroke-width="1" stroke-dasharray="4 2" filter="url(#glow)"/>
  <text x="368" y="468" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b7410e" font-weight="700" letter-spacing="0.1em">SELF</text>
  <text x="352" y="488" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b7410e" font-weight="700" letter-spacing="0.1em">CAST</text>
  <text x="344" y="508" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6b7280">Studio Feed</text>

  <!-- Right sidebar - Destinations -->
  <rect x="816" y="80" width="360" height="280" rx="4" fill="url(#panel)" stroke="#232128" stroke-width="1"/>
  <text x="832" y="102" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6b7280" letter-spacing="0.12em">DESTINATIONS</text>

  <!-- Destination card 1 - local -->
  <rect x="832" y="116" width="328" height="56" rx="3" fill="#0b0a0d" stroke="#4a7c7a" stroke-width="1"/>
  <text x="844" y="136" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ded9e2">Studio Self-Cast</text>
  <rect x="844" y="142" width="32" height="14" rx="2" fill="none" stroke="#4a7c7a" stroke-width="0.8"/>
  <text x="847" y="153" font-family="'JetBrains Mono', monospace" font-size="7" fill="#4a7c7a">SELF</text>
  <text x="1080" y="136" font-family="'JetBrains Mono', monospace" font-size="9" fill="#b7410e" font-weight="700">LIVE</text>
  <text x="844" y="162" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6b7280">local · 1080p</text>

  <!-- Destination card 2 - youtube -->
  <rect x="832" y="180" width="328" height="56" rx="3" fill="#0b0a0d" stroke="#232128" stroke-width="1"/>
  <text x="844" y="200" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ded9e2">YouTube Main</text>
  <text x="1080" y="200" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6b8e6b" font-weight="700">OK</text>
  <text x="844" y="220" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6b7280">youtube · 1080p</text>

  <!-- Destination card 3 - telegram -->
  <rect x="832" y="244" width="328" height="56" rx="3" fill="#0b0a0d" stroke="#232128" stroke-width="1"/>
  <text x="844" y="264" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ded9e2">Telegram Channel</text>
  <text x="1064" y="264" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9a7b2e" font-weight="700">ARMED</text>
  <text x="844" y="284" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6b7280">telegram · 720p</text>

  <!-- Right sidebar - Templates -->
  <rect x="816" y="376" width="360" height="184" rx="4" fill="url(#panel)" stroke="#232128" stroke-width="1"/>
  <text x="832" y="398" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6b7280" letter-spacing="0.12em">TEMPLATES</text>

  <!-- Template cards -->
  <rect x="832" y="412" width="156" height="60" rx="3" fill="#0b0a0d" stroke="#232128" stroke-width="1"/>
  <text x="844" y="432" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ded9e2">Default 16:9</text>
  <rect x="844" y="440" width="36" height="14" rx="2" fill="none" stroke="#6b7280" stroke-width="0.8"/>
  <text x="847" y="451" font-family="'JetBrains Mono', monospace" font-size="7" fill="#6b7280">YOUTUBE</text>

  <rect x="1004" y="412" width="156" height="60" rx="3" fill="#0b0a0d" stroke="#232128" stroke-width="1"/>
  <text x="1016" y="432" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ded9e2">Custom Overlay</text>
  <rect x="1016" y="440" width="36" height="14" rx="2" fill="none" stroke="#9a7b2e" stroke-width="0.8"/>
  <text x="1019" y="451" font-family="'JetBrains Mono', monospace" font-size="7" fill="#9a7b2e">CUSTOM</text>

  <!-- Transmission Kit output -->
  <rect x="832" y="484" width="328" height="64" rx="3" fill="#050506" stroke="#232128" stroke-width="1"/>
  <text x="844" y="504" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6b7280" letter-spacing="0.1em">TRANSMISSION KIT</text>
  <text x="844" y="520" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ded9e2">[YOUTUBE] Show Title</text>
  <text x="844" y="536" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6b7280">labels: youtube, live</text>

  <!-- Bottom nav -->
  <rect x="0" y="576" width="1200" height="24" fill="#121115"/>
  <rect x="0" y="576" width="1200" height="1" fill="#232128"/>
  <rect x="480" y="577" width="80" height="22" fill="none"/>
  <rect x="480" y="597" width="80" height="2" fill="#b7410e"/>
  <text x="504" y="593" font-family="'JetBrains Mono', monospace" font-size="10" fill="#b7410e" font-weight="700">LIVE</text>
  <text x="600" y="593" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8a8194">DESTINATIONS</text>
  <text x="748" y="593" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8a8194">LOGS</text>

  <!-- Status indicators -->
  <text x="24" y="593" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6b7280">INGEST: CONNECTED</text>
  <text x="180" y="593" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6b8e6b">PIPELINE: OK</text>
  <text x="320" y="593" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6b7280">STREAMS: 3</text>
</svg>
