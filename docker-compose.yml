services:
  syco23-control:
    build:
      context: .
      dockerfile: Dockerfile
    image: syco23/multicast-control:local
    container_name: syco23-multicast-control
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
