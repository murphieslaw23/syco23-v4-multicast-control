# Production composition for the IONOS VPS.
#
# Installed by deploy/ionos/install.sh and rolled forward by deploy/ionos/deploy.sh.
# Runs the published GHCR image rather than building on the server. Secrets and
# host-specific values live in `shared/.env` outside every release, created once
# by the installer and never copied into a release directory.
#
# Caddy terminates TLS and obtains certificates automatically, so the host needs
# no separate reverse proxy. The runtime is additionally published on loopback
# for diagnostics, but public traffic always arrives through Caddy.
services:
  syco23-control:
    image: ${SYCO_IMAGE:?Set SYCO_IMAGE to the fully qualified GHCR reference}
    container_name: syco23-multicast-control
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${SYCO_BIND_PORT:-3000}:3000"
    networks:
      - syco23
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      SYCO_DB_DRIVER: native
      SYCO_DB_PATH: /app/data/syco23.sqlite
      SYCO_DATA_DIR: /app/data
      SYCO_ASSET_DIR: /app/data/assets
      SYCO_PREVIEW_DIR: /app/data/preview
      SYCO_BACKUP_DIR: /app/data/backups
      # Origin of the Vercel-hosted console. The event socket connects to this
      # runtime directly instead of through the proxy rewrite, so the browser
      # origin has to be named explicitly.
      SYCO_ALLOWED_WS_ORIGINS: ${SYCO_ALLOWED_WS_ORIGINS:?Set SYCO_ALLOWED_WS_ORIGINS to the console origin}
      SYCO_BOOTSTRAP_ADMIN_USER: ${SYCO_BOOTSTRAP_ADMIN_USER:-}
      SYCO_BOOTSTRAP_ADMIN_PASSWORD: ${SYCO_BOOTSTRAP_ADMIN_PASSWORD:-}
      SYCO_ADMIN_TOKEN: ${SYCO_ADMIN_TOKEN:-}
      SYCO_OPERATOR_TOKEN: ${SYCO_OPERATOR_TOKEN:-}
      SYCO_VIEWER_TOKEN: ${SYCO_VIEWER_TOKEN:-}
      SYCO_AZURACAST_URL: ${SYCO_AZURACAST_URL:-}
      SYCO_AZURACAST_STATION: ${SYCO_AZURACAST_STATION:-}
      SYCO_AZURACAST_API_KEY: ${SYCO_AZURACAST_API_KEY:-}
      STREAM_INGEST_URL: ${STREAM_INGEST_URL:-}
      SYCO_RETENTION_LOG_DAYS: ${SYCO_RETENTION_LOG_DAYS:-30}
      SYCO_RETENTION_AUDIT_DAYS: ${SYCO_RETENTION_AUDIT_DAYS:-365}
      SYCO_PROVIDER_PROBE_INTERVAL_MS: ${SYCO_PROVIDER_PROBE_INTERVAL_MS:-15000}
    volumes:
      - syco23-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    cpus: 5.0
    mem_limit: 6g
    mem_reservation: 4g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: caddy:2.10-alpine
    container_name: syco23-multicast-control-caddy
    restart: unless-stopped
    depends_on:
      - syco23-control
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public API hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - syco23

# A single bridge network, deliberately NOT `internal: true`. The runtime must
# reach AzuraCast for metadata, the provider APIs for acknowledgement probes,
# and the RTMP ingest endpoints it pushes to — an internal network would cut
# all of that off while leaving the container superficially healthy.
networks:
  syco23:

volumes:
  syco23-data:
  caddy-data:
  caddy-config:
