version: "3.9"

services:
  runtime:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3010
      DB_PATH: /app/data/syco23.sqlite
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      MEDIA_MODE: ${MEDIA_MODE:-virtual}
      FFMPEG_PATH: /usr/bin/ffmpeg
      TOTEM_ASSET_PATH: /app/apps/control-ui/public/assets/syco23-totem-ritual.png
      YOUTUBE_STREAM_KEY: ${YOUTUBE_STREAM_KEY:-}
      TELEGRAM_STREAM_KEY: ${TELEGRAM_STREAM_KEY:-}
      TWITCH_STREAM_KEY: ${TWITCH_STREAM_KEY:-}
      LOCAL_PREVIEW_KEY: ${LOCAL_PREVIEW_KEY:-}
    expose:
      - "3010"
    volumes:
      - syco23-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    networks:
      - backend

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - runtime
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - edge
      - backend

networks:
  edge:
  backend:
    internal: true

volumes:
  syco23-data:
  caddy-data:
  caddy-config:

