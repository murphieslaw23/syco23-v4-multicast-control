name: Deploy frontend (Vercel)

# Builds the operator console SPA and ships it to Vercel. The console talks to
# the IONOS runtime through the proxy route declared in vercel.json, so the two
# halves deploy independently.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Production pushes and preview builds read different variable scopes, so the
    # target environment is derived from the trigger.
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      IS_PRODUCTION: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        # Also materialises RUNTIME_API_ORIGIN and VITE_RUNTIME_WS_ORIGIN from the
        # Vercel project so the build embeds the right runtime endpoints.
        run: |
          if [ "$IS_PRODUCTION" = "true" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          fi

      - name: Build
        run: |
          if [ "$IS_PRODUCTION" = "true" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          if [ "$IS_PRODUCTION" = "true" ]; then
            url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          else
            url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check
        run: curl --fail --show-error --silent --retry 5 --retry-delay 3 --retry-all-errors "${{ steps.deploy.outputs.url }}" >/dev/null
