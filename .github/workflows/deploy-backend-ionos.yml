name: Deploy backend (IONOS)

# Publishes the runtime image to GHCR and rolls the IONOS VPS forward to it.
#
# This repository owns the IONOS host. The superseded v5 bundle is archived
# under deploy/ionos/archive-v5/; its packaging was adapted into
# deploy/ionos/install.sh, which performs the first-time installation. This
# workflow handles every rollout after that.
#
# The deploy job is inert until the IONOS secrets exist, so enabling continuous
# deployment is a matter of adding them. Run the read-only ionos-recon workflow
# first to confirm nothing else holds ports 80/443 on the target host.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing GHCR tag to roll out (leave empty to build from the current ref)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-backend-ionos
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # Skipped when redeploying an image that already exists in the registry.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The image build repeats release:check internally; running it here first
      # fails fast with readable output instead of inside a Docker layer.
      - run: npm run release:check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=main
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - id: reference
        # Deploy the immutable digest rather than a moving tag so a rollback
        # always targets exactly the bits that were verified here.
        run: echo "image=${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check IONOS configuration
        id: guard
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
          IONOS_APP_DIR: ${{ secrets.IONOS_APP_DIR }}
        # Until the VPS secrets exist there is nothing to deploy to. Skipping
        # keeps the branch green instead of failing on absent configuration.
        run: |
          if [ -z "${IONOS_HOST:-}" ] || [ -z "${IONOS_USER:-}" ] || [ -z "${IONOS_SSH_KEY:-}" ] || [ -z "${IONOS_APP_DIR:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::IONOS secrets are not configured; skipping backend deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image reference
        id: image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$IMAGE_TAG" ]; then
            [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
              echo "::error::image_tag is not a valid container tag."
              exit 1
            }
            echo "image=${REGISTRY}/${IMAGE_NAME}:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ needs.build.outputs.image }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.guard.outputs.configured == 'true'
        env:
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_SSH_PORT: ${{ secrets.IONOS_SSH_PORT }}
          IONOS_SSH_KNOWN_HOSTS: ${{ secrets.IONOS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$IONOS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${IONOS_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$IONOS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Falls back to trust-on-first-use. Set IONOS_SSH_KNOWN_HOSTS to pin
            # the host key and make this step resistant to interception.
            ssh-keyscan -p "${IONOS_SSH_PORT:-22}" -H "$IONOS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Verify non-root deployment access
        if: steps.guard.outputs.configured == 'true'
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_SSH_PORT: ${{ secrets.IONOS_SSH_PORT }}
          IONOS_APP_DIR: ${{ secrets.IONOS_APP_DIR }}
          IONOS_DEPLOY_GROUP: ${{ vars.IONOS_DEPLOY_GROUP || 'syco23-deploy' }}
        run: |
          set -euo pipefail
          PORT="${IONOS_SSH_PORT:-22}"
          [[ "$IONOS_DEPLOY_GROUP" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || {
            echo "::error::IONOS_DEPLOY_GROUP is not a valid Linux group name."
            exit 1
          }
          [[ "$IONOS_APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ && "$IONOS_APP_DIR" != *'/../'* ]] || {
            echo "::error::IONOS_APP_DIR must be a normalized absolute path."
            exit 1
          }
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$IONOS_USER@$IONOS_HOST" \
            "bash -s -- '$IONOS_DEPLOY_GROUP' '$IONOS_APP_DIR'" <<'REMOTE'
          set -euo pipefail
          IONOS_DEPLOY_GROUP="$1"
          IONOS_APP_DIR="$2"
          test "$(id -u)" -ne 0 || {
            echo "deployment account must be non-root" >&2
            exit 1
          }
          id -nG | tr ' ' '\n' | grep -Fx "$IONOS_DEPLOY_GROUP" >/dev/null || {
            echo "deployment account is not in the required rollout group" >&2
            exit 1
          }
          test -d "$IONOS_APP_DIR" && test ! -w "$IONOS_APP_DIR" || {
            echo "application root must exist and remain non-writable" >&2
            exit 1
          }
          test -d "$IONOS_APP_DIR/releases" && test -w "$IONOS_APP_DIR/releases" || {
            echo "deployment account cannot stage releases" >&2
            exit 1
          }
          test -d "$IONOS_APP_DIR/pointers" && test -w "$IONOS_APP_DIR/pointers" || {
            echo "deployment account cannot advance the active release pointer" >&2
            exit 1
          }
          test -L "$IONOS_APP_DIR/current" && test -L "$IONOS_APP_DIR/pointers/current" || {
            echo "immutable release pointers are missing" >&2
            exit 1
          }
          case "$(readlink -f "$IONOS_APP_DIR/current")" in
            "$IONOS_APP_DIR"/releases/*) ;;
            *) echo "current does not resolve beneath releases" >&2; exit 1 ;;
          esac
          test -f "$IONOS_APP_DIR/shared/.env" && test -r "$IONOS_APP_DIR/shared/.env" && test -w "$IONOS_APP_DIR/shared/.env" || {
            echo "deployment account cannot update the shared environment" >&2
            exit 1
          }
          docker info >/dev/null 2>&1 || {
            echo "deployment account cannot access Docker" >&2
            exit 1
          }
          REMOTE

      - name: Ship deployment assets
        if: steps.guard.outputs.configured == 'true'
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_SSH_PORT: ${{ secrets.IONOS_SSH_PORT }}
          IONOS_APP_DIR: ${{ secrets.IONOS_APP_DIR }}
        run: |
          set -euo pipefail
          PORT="${IONOS_SSH_PORT:-22}"
          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_DIR="$IONOS_APP_DIR/releases/$RELEASE_ID"
          # A run gets one new directory. Refusing an existing target prevents
          # retries or concurrent work from mutating an already-staged release.
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$IONOS_USER@$IONOS_HOST" "mkdir '$RELEASE_DIR'"
          scp -i ~/.ssh/id_deploy -P "$PORT" \
            deploy/ionos/compose.prod.yml deploy/ionos/Caddyfile deploy/ionos/deploy.sh \
            "$IONOS_USER@$IONOS_HOST:$RELEASE_DIR/"
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$IONOS_USER@$IONOS_HOST" \
            "chmod 0440 '$RELEASE_DIR/compose.prod.yml' '$RELEASE_DIR/Caddyfile' && chmod 0550 '$RELEASE_DIR/deploy.sh'"

      - name: Roll out
        if: steps.guard.outputs.configured == 'true'
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_SSH_PORT: ${{ secrets.IONOS_SSH_PORT }}
          IONOS_APP_DIR: ${{ secrets.IONOS_APP_DIR }}
          IMAGE: ${{ steps.image.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PORT="${IONOS_SSH_PORT:-22}"
          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_DIR="$IONOS_APP_DIR/releases/$RELEASE_ID"
          # The token goes over stdin so it never appears in the remote argv.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy -p "$PORT" "$IONOS_USER@$IONOS_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          printf -v REMOTE_SCRIPT '%q' "$RELEASE_DIR/deploy.sh"
          printf -v REMOTE_IMAGE '%q' "$IMAGE"
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$IONOS_USER@$IONOS_HOST" \
            "$REMOTE_SCRIPT $REMOTE_IMAGE"

      - name: Verify public endpoint
        if: steps.guard.outputs.configured == 'true'
        env:
          API_HEALTH_URL: ${{ secrets.IONOS_API_HEALTH_URL }}
        # Confirms the TLS reverse proxy in front of the container is serving the
        # new release, not just that the container is healthy on loopback.
        run: |
          set -euo pipefail
          if [ -z "${API_HEALTH_URL:-}" ]; then
            echo "IONOS_API_HEALTH_URL is not configured; skipping public verification."
            exit 0
          fi
          curl --fail --show-error --silent --retry 5 --retry-delay 5 --retry-all-errors "$API_HEALTH_URL" >/dev/null

      - name: Revoke registry credentials
        if: always() && steps.guard.outputs.configured == 'true'
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_SSH_PORT: ${{ secrets.IONOS_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${IONOS_SSH_PORT:-22}" "$IONOS_USER@$IONOS_HOST" \
            "docker logout ghcr.io" || true
          rm -f ~/.ssh/id_deploy
